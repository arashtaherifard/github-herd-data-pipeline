apiVersion: batch/v1
kind: Job
metadata:
  name: github-herd-phase3-validation
  labels:
    app.kubernetes.io/name: github-herd-phase3
    app.kubernetes.io/component: delivery-validation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-herd-phase3
        app.kubernetes.io/component: delivery-validation
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: phase3-validation
          image: github-herd-phase3:latest
          imagePullPolicy: IfNotPresent
          args:
            - --batch-size
            - "5000"
          env:
            - name: DO_NOT_TRACK
              value: "1"
            - name: PREFECT_SERVER_ANALYTICS_ENABLED
              value: "false"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 64Mi
