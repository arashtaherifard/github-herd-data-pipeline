name: Phase 3 Delivery Validation

on:
  push:
    branches:
      - main
      - phase3
  pull_request:
    branches:
      - main
      - phase3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-validation:
    name: Portable read-only validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-phase3-runtime.txt

      - name: Install Phase 3 runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --requirement requirements-phase3-runtime.txt

      - name: Validate Python and shell syntax
        run: |
          python -m py_compile \
            scripts/validate_phase3_delivery.py
          bash -n run_phase3.sh

      - name: Run read-only Phase 3 validation
        env:
          PHASE3_PYTHON: python
          DO_NOT_TRACK: "1"
          PREFECT_SERVER_ANALYTICS_ENABLED: "false"
          PYTHONDONTWRITEBYTECODE: "1"
        run: ./run_phase3.sh

  container-validation:
    name: Build and run Phase 3 container
    runs-on: ubuntu-latest
    needs: portable-validation

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Phase 3 image
        run: |
          docker build \
            --file Dockerfile.phase3 \
            --tag github-herd-phase3:ci \
            .

      - name: Run container read-only
        run: |
          docker run \
            --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            github-herd-phase3:ci

  kubernetes-validation:
    name: Validate Kubernetes manifest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.3

      - name: Parse Kubernetes manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path(
              "k8s/phase3-validation-job.yaml"
          )

          documents = list(
              yaml.safe_load_all(
                  path.read_text(
                      encoding="utf-8"
                  )
              )
          )

          assert len(documents) == 1

          manifest = documents[0]

          assert manifest["apiVersion"] == "batch/v1"
          assert manifest["kind"] == "Job"
          assert (
              manifest["metadata"]["name"]
              == "github-herd-phase3-validation"
          )

          container = (
              manifest["spec"]["template"]["spec"]
              ["containers"][0]
          )

          assert (
              container["image"]
              == "github-herd-phase3:latest"
          )

          assert (
              manifest["spec"]["template"]["spec"]
              ["restartPolicy"]
              == "Never"
          )

          print(
              "Kubernetes Phase 3 manifest:",
              "VALID",
          )
          PY
